# config/data_rome.yaml — เคาะจาก D0 audit เต็ม (315 คัน, 20.25 M จุด) วันที่ 2026-09-06
city: rome
tz: Europe/Rome
raw_dir: DataTaxiRome               # โฟลเดอร์ที่มี taxi_february.txt
raw_format: roma_taxi               # บรรทัด: id;timestamp+01;POINT(lat lon)  ← lat มาก่อน lon

# ---- ขอบเขต (D0: ตัด 5.1% ของจุด; รวมทาง Fiumicino ด้านตะวันตก)
bbox: {lat: [41.786, 41.955], lon: [12.264, 12.571]}
origin: [41.9020, 12.4815]
task_bbox: {lat: [41.830, 41.955], lon: [12.420, 12.560]}       # เขตเมือง (ข้อเสนอ — ยืนยัน)

# ---- เวลา (D0 ①: p50 = 7 s, p75 = 10 s → downsample ลง 60 s เท่า SF)
dt_s: 60
H: 60
M_in: 8
cycle_min: 60
gap_max_s: 300
resample_mode: downsample           # จุดดิบถี่กว่า Δτ 6–8 เท่า: ใช้ตำแหน่ง interpolate ณ grid ไม่เฉลี่ยหน้าต่าง

# ---- clean (D0 ②: v > 150 = 0.7%; 47% ของก้าวช้ากว่า 1 km/h — รอสั้น ๆ ไม่ใช่ parked; parked > 30 นาที = 10.6%)
v_max_kmh: 150
speed_filter_iters: 5
speed_min_dt_s: 3                   # ข้ามการคำนวณ v เมื่อ dt < 3 s (จุดถี่)
parked_radius_m: 30
parked_min_minutes: 30
min_days_per_cab: 3
min_points_per_cab: 1000

# ---- sensing (D0 ③ ที่ R = 200 m: median residence 58.6 s, ≥ 60 s = 48.9 %) — ค่าเดียวกับ SF
R_m: 200
pt_s: 60
R_sensitivity: [100, 150, 200, 250]
pt_sensitivity: [30, 60, 120]

# ---- split ตามวัน (D0 ④: วันธรรมดา 9–12 cycle/วัน ที่ ≥ 60 คัน; เสาร์–อาทิตย์ 0 → test ต้องเป็นวันธรรมดา)
dates:
  train: [2014-02-01, 2014-02-18]   # 18 วัน (รวมเสาร์–อาทิตย์ ใช้ฝึกได้)
  val:   [2014-02-19, 2014-02-23]   # 5 วัน (พุธ–อาทิตย์)
  test:  [2014-02-24, 2014-02-28]   # จันทร์–ศุกร์ → 52 cycle ที่ ≥ 60 คัน (ชุด test ของ D4 ทั้งก้อน)
  test_dev:   [2014-02-24, 2014-02-25]   # development test (จันทร์–อังคาร ≈ 21 cycle)
  test_final: [2014-02-26, 2014-02-28]   # final test (พุธ–ศุกร์ ≈ 31 cycle ≥ 30) — เปิดครั้งเดียวหลัง freeze
  unused: [2014-03-01, 2014-03-02]  # เสาร์–อาทิตย์หลัง test — ไม่ใช้ (ไม่มี cycle ถึง 60 คัน)
usable_cycle_rule: {min_workers_ready: 60, weekdays_only: true}   # ประกาศในบทความ: Rome ใช้กะทำงานวันธรรมดา

# ---- ฟีเจอร์
features: [x, y, v, dx, dy, dow_sin, dow_cos, slot_sin, slot_cos, occ]
occ_feature: false                  # ชุดนี้ไม่มี occupancy → คอลัมน์ occ = 0 คงที่ (หรือถอด)
scaler_fit_on: train

# ---- ขนาดปัญหา (คงเท่า SF; K_i จะเล็กกว่าเองเพราะ n_i ต่ำกว่า)
W: 60
T: 200
master_seed: 20260906

# ---- ตัวเลขจาก D0 ที่ต้องลงบทความ
audit:
  n_cabs: 315
  n_points_raw: 20252636
  interval_p50_p75_p95_s: [7, 10, 15]
  pct_gap_gt_300s: 0.1
  speed_p50_p95_p99_kmh: [1.5, 64.9, 130.6]
  pct_speed_gt_vmax: 0.7
  pct_steps_below_1kmh: 47.0
  hours_logged_per_cab_per_day: 5.0
  residence_R200: {median_s: 58.6, pct_ge_30s: 74.7, pct_ge_60s: 48.9, pct_ge_120s: 17.8}
  visits_per_point_per_hour_all_cabs: 10.7
  usable_cycles_total: 223
  cabs_ready_per_cycle_median_weekday: 57
  cabs_ready_per_cycle_max: 99
